<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(pageTitle=#{error.403.title}, pageDescription=#{error.403.message})}">
</head>
<body>
<div th:replace="~{layout :: header}"></div>
<main class="page error-page">
  <h1 th:text="#{error.403.code}" class="error-code"></h1>
  <p th:text="#{error.403.message}"></p>
  <a th:href="@{/}" th:text="#{error.home}" class="button-primary"></a>
</main>
<div th:replace="~{layout :: footer}"></div>
</body>
</html>
