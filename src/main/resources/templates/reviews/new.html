<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(pageTitle=${pageTitle}, pageDescription=${pageDescription})}">
</head>
<body>
<div th:replace="~{layout :: header}"></div>
<main class="page">
<div class="read">
  <h1 th:text="#{review.form.title}"></h1>

  <section>
    <h2 th:text="#{review.form.storeQuery}"></h2>
    <form th:action="@{/reviews/new}" method="get" class="search-form">
      <div class="field">
        <label for="storeQuery" th:text="#{review.form.storeQuery}"></label>
        <input type="search" id="storeQuery" name="storeQuery" th:value="${storeQuery}"
               th:placeholder="#{review.form.storeQuery.placeholder}" maxlength="50">
      </div>
      <button type="submit" th:text="#{review.form.storeQuery.button}" class="button-secondary"></button>
    </form>
    <div th:if="${searched and #lists.isEmpty(candidates)}">
      <p th:text="#{review.form.storeNotFound}"></p>
    </div>
    <ul th:unless="${#lists.isEmpty(candidates)}">
      <li th:each="store : ${candidates}">
        <span th:text="${store.name}"></span>
        <span th:text="${store.address}"></span>
        <span class="badge" th:text="${store.category}"></span>
        <a th:href="@{/reviews/new(storeId=${store.id})}" th:text="#{review.form.storeChoose}"></a>
      </li>
    </ul>
  </section>

  <div th:if="${selectedStore}">
    <h2 th:text="#{review.form.storeSelected}"></h2>
    <p>
      <span th:text="${selectedStore.name}"></span>
      <span th:text="${selectedStore.address}"></span>
      <span class="badge" th:text="${selectedStore.category}"></span>
    </p>
    <a th:href="@{/reviews/new}" th:text="#{review.form.storeChange}"></a>
  </div>
  <div th:if="${storeMissing}">
    <p role="alert" class="flash-error" th:text="#{review.form.storeNotSelected}"></p>
  </div>

  <form th:action="@{/reviews}" th:object="${form}" method="post" class="review-form">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div th:if="${#fields.hasAnyErrors()}" role="alert" class="form-error-summary">
      <p th:text="#{error.form.invalid}"></p>
    </div>

    <input th:if="${selectedStore}" type="hidden" th:field="*{storeId}">

    <div th:unless="${selectedStore}">
      <h2 th:text="#{review.form.newStore}"></h2>
      <div class="field">
        <label for="storeName">
          <span th:text="#{review.form.storeName}"></span>
          <span class="required-mark" th:text="#{review.form.required}"></span>
        </label>
        <input type="text" id="storeName" th:field="*{storeName}" maxlength="50"
               th:attr="aria-invalid=${#fields.hasErrors('storeName')} ? 'true' : null, aria-describedby=${#fields.hasErrors('storeName')} ? 'storeName-error' : null">
        <p id="storeName-error" th:if="${#fields.hasErrors('storeName')}" class="field-error" th:errors="*{storeName}"></p>
      </div>
      <div class="field">
        <label for="storeAddress">
          <span th:text="#{review.form.storeAddress}"></span>
          <span class="required-mark" th:text="#{review.form.required}"></span>
        </label>
        <input type="text" id="storeAddress" th:field="*{storeAddress}" maxlength="200"
               th:attr="aria-invalid=${#fields.hasErrors('storeAddress')} ? 'true' : null, aria-describedby=${#fields.hasErrors('storeAddress')} ? 'storeAddress-error' : null">
        <p id="storeAddress-error" th:if="${#fields.hasErrors('storeAddress')}" class="field-error" th:errors="*{storeAddress}"></p>
      </div>
      <div class="field">
        <label for="storeRegion">
          <span th:text="#{review.form.storeRegion}"></span>
          <span class="required-mark" th:text="#{review.form.required}"></span>
        </label>
        <input type="text" id="storeRegion" th:field="*{storeRegion}"
               th:placeholder="#{review.form.storeRegion.placeholder}" maxlength="30"
               th:attr="aria-invalid=${#fields.hasErrors('storeRegion')} ? 'true' : null, aria-describedby=${#fields.hasErrors('storeRegion')} ? 'storeRegion-error' : null">
        <p class="form-help" th:text="#{review.form.storeRegion.help}"></p>
        <p id="storeRegion-error" th:if="${#fields.hasErrors('storeRegion')}" class="field-error" th:errors="*{storeRegion}"></p>
      </div>
      <div class="field">
        <label for="storeCategory">
          <span th:text="#{review.form.storeCategory}"></span>
          <span class="required-mark" th:text="#{review.form.required}"></span>
        </label>
        <select id="storeCategory" th:field="*{storeCategory}"
                th:attr="aria-invalid=${#fields.hasErrors('storeCategory')} ? 'true' : null, aria-describedby=${#fields.hasErrors('storeCategory')} ? 'storeCategory-error' : null">
          <option value="" th:text="#{review.form.storeCategory.prompt}"></option>
          <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
        </select>
        <p id="storeCategory-error" th:if="${#fields.hasErrors('storeCategory')}" class="field-error" th:errors="*{storeCategory}"></p>
      </div>
      <p th:if="${#fields.hasErrors('storeId')}" role="alert" id="storeId-error" class="field-error" th:errors="*{storeId}"></p>
    </div>

    <div class="field">
      <label for="nickname">
        <span th:text="#{review.form.nickname}"></span>
        <span class="required-mark" th:text="#{review.form.required}"></span>
      </label>
      <input type="text" id="nickname" th:field="*{nickname}" maxlength="20"
             th:attr="aria-invalid=${#fields.hasErrors('nickname')} ? 'true' : null, aria-describedby=${#fields.hasErrors('nickname')} ? 'nickname-error' : null">
      <p id="nickname-error" th:if="${#fields.hasErrors('nickname')}" class="field-error" th:errors="*{nickname}"></p>
    </div>
    <div class="field">
      <label for="password">
        <span th:text="#{review.form.password}"></span>
        <span class="required-mark" th:text="#{review.form.required}"></span>
      </label>
      <input type="password" id="password" th:field="*{password}" maxlength="20" autocomplete="new-password"
             th:attr="aria-invalid=${#fields.hasErrors('password')} ? 'true' : null, aria-describedby=${#fields.hasErrors('password')} ? 'password-error password-help' : 'password-help'">
      <p id="password-help" class="form-help" th:text="#{review.form.password.help}"></p>
      <p id="password-error" th:if="${#fields.hasErrors('password')}" class="field-error" th:errors="*{password}"></p>
    </div>
    <fieldset class="field">
      <legend>
        <span th:text="#{review.form.rating}"></span>
        <span class="required-mark" th:text="#{review.form.required}"></span>
      </legend>
      <div class="rating-group">
        <th:block th:each="n : ${#numbers.sequence(5, 1, -1)}">
          <input type="radio" th:field="*{rating}" th:value="${n}" th:id="${'rating-' + n}" class="visually-hidden"
                 th:attr="aria-invalid=${#fields.hasErrors('rating')} ? 'true' : null, aria-describedby=${#fields.hasErrors('rating')} ? 'rating-error' : null">
          <label th:for="${'rating-' + n}" class="rating-star"><span aria-hidden="true">★</span><span class="visually-hidden" th:text="${n} + '점'"></span></label>
        </th:block>
      </div>
      <p id="rating-error" th:if="${#fields.hasErrors('rating')}" class="field-error" th:errors="*{rating}"></p>
    </fieldset>
    <div class="field">
      <label for="title">
        <span th:text="#{review.form.title.label}"></span>
        <span class="required-mark" th:text="#{review.form.required}"></span>
      </label>
      <input type="text" id="title" th:field="*{title}" maxlength="100"
             th:attr="aria-invalid=${#fields.hasErrors('title')} ? 'true' : null, aria-describedby=${#fields.hasErrors('title')} ? 'title-error' : null">
      <p id="title-error" th:if="${#fields.hasErrors('title')}" class="field-error" th:errors="*{title}"></p>
    </div>
    <div class="field">
      <label for="content">
        <span th:text="#{review.form.content}"></span>
        <span class="required-mark" th:text="#{review.form.required}"></span>
      </label>
      <textarea id="content" th:field="*{content}" maxlength="5000" rows="8"
                th:attr="aria-invalid=${#fields.hasErrors('content')} ? 'true' : null, aria-describedby=${#fields.hasErrors('content')} ? 'content-error' : null"></textarea>
      <p id="content-error" th:if="${#fields.hasErrors('content')}" class="field-error" th:errors="*{content}"></p>
    </div>
    <button type="submit" th:text="#{review.form.submit}" class="button-primary btn-hero"></button>
    <a th:href="@{/reviews}" th:text="#{review.form.cancel}" class="button-secondary"></a>
  </form>
</div>
</main>
<div th:replace="~{layout :: footer}"></div>
</body>
</html>
