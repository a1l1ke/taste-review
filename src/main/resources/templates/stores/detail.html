<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(pageTitle=${pageTitle}, pageDescription=${pageDescription})}">
</head>
<body>
<div th:replace="~{layout :: header}"></div>
<main class="page">
  <h1 th:text="${store.name}"></h1>
  <section class="store-box">
    <dl>
      <div>
        <dt th:text="#{review.form.storeName}"></dt>
        <dd><span class="store-name" th:text="${store.name}"></span>
          <span class="badge badge-category" th:text="${store.category}"></span></dd>
      </div>
      <div>
        <dt th:text="#{review.form.storeAddress}"></dt>
        <dd th:text="${store.address}"></dd>
      </div>
      <div>
        <dt th:text="#{review.form.storeRegion}"></dt>
        <dd th:text="${store.region}"></dd>
      </div>
    </dl>
  </section>
  <div th:if="${store.hasReviews()}" class="store-rating-summary">
    <span class="store-rating-number" th:text="${store.averageRating}"></span>
    <span class="rating"><span aria-hidden="true"><span th:each="n : ${#numbers.sequence(1, 5)}" th:text="${n <= T(java.lang.Double).parseDouble(store.averageRating)} ? '★' : '☆'" th:class="${n <= T(java.lang.Double).parseDouble(store.averageRating)} ? 'star-filled' : 'star-empty'"></span></span>
      <span th:text="#{review.rating.label(${store.averageRating})}"></span></span>
    <span class="store-rating-count" th:text="#{store.detail.reviewCount(${store.reviewCount})}"></span>
  </div>
  <p th:unless="${store.hasReviews()}" th:text="#{store.detail.noReviews}"></p>

  <section th:if="${store.hasReviews()}">
    <h2 th:text="#{store.detail.reviews}"></h2>
    <div class="review-list">
      <th:block th:each="item : ${store.reviews}">
        <article th:replace="~{layout :: reviewCard(item=${item})}"></article>
      </th:block>
    </div>
    <div th:replace="~{layout :: pagination(window=${pageWindow}, base=${'/stores/' + store.id + '?page='})}"></div>
  </section>
</main>
<div th:replace="~{layout :: footer}"></div>
</body>
</html>
